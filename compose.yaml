
services:
  db:
    image: postgres:17
    container_name: lenny-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lenny_assistant
      POSTGRES_USER: lenny_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenny_user -d lenny_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
